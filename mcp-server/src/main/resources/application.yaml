spring:
  application:
    name: mcp-server
  ai:
    mcp:
      server:
        name: playground-mcp-server
        version: 0.0.1
        type: sync
        protocol: streamable
        streamable-http:
          mcp-endpoint: /mcp

server:
  # Local-only playground: unauthenticated MCP endpoint must not be exposed externally.
  address: 127.0.0.1
  port: 8087

playground:
  mcp:
    transport:
      allowed-origins:
        - http://localhost:*
        - http://127.0.0.1:*
      allowed-hosts:
        - localhost:*
        - 127.0.0.1:*
