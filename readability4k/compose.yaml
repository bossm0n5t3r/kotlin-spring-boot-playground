services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: readability4k-backend
    ports:
      - "1031:1031"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - readability4k

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        - PUBLIC_API_BASE=${PUBLIC_API_BASE:-http://localhost:1031}
        - PUBLIC_BASE_PATH=${PUBLIC_BASE_PATH:-/}
    container_name: readability4k-frontend
    ports:
      - "1033:1033"
    depends_on:
      - backend
    environment:
      - HOST=0.0.0.0
      - PORT=1033
    networks:
      - readability4k

networks:
  readability4k:
    driver: bridge
