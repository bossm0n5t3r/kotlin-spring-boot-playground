services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: readability4k-backend
    expose:
      - "1031"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - readability4k

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        - PUBLIC_BASE_PATH=${PUBLIC_BASE_PATH:-/}
    container_name: readability4k-frontend
    ports:
      - "1033:1033"
    depends_on:
      - backend
    environment:
      - HOST=0.0.0.0
      - PORT=1033
      - BACKEND_URL=http://backend:1031
    networks:
      - readability4k

networks:
  readability4k:
    driver: bridge
